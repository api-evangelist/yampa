name: Yampa
description: >-
  Yampa is a Paris-based B2B platform for deploying and operating fleets of
  autonomous AI agents that handle customer service end-to-end across voice,
  chat, email, ticketing, and messaging channels. Its Y.core orchestration
  platform provides a visual workflow builder, guardrails, a knowledge layer,
  multichannel orchestration, QA and auditing tools, and observability, with
  connectors to CRMs, helpdesks, and telephony systems (Salesforce, Zendesk,
  Intercom, Twilio, Genesys, and others). Founded in 2024 by Marin Huet,
  Baptiste Saintot, and Patrice Mazoyer, Yampa raised a ~EUR 3M seed led by
  Partech and emphasizes sovereign EU-hosted infrastructure with GDPR and SOC 2
  aligned security. Developer documentation at docs.yampa.ai is gated behind an
  access code; the public status page lists an API component alongside chat,
  email, calls, and console services.
